en:
  theme_metadata:
    description: Theme component which adds thumbnails to topic lists. You can enable it globally, or per-category
    settings:
      default_thumbnail_mode: Which thumbnail display mode should be used by default?
      docs_thumbnail_mode: If the docs plugin is enabled, which thumbnail display mode should be used for docs topics?
      compact_categories: The compact view will be used in these categories
      card_categories: The card view will be used in these categories
      compact_tags: The compact view will be used for these tags
      card_tags: The card view will be used for these tags
      suggested_topics_mode: Which thumbnail display mode should be used for suggested topics? If blank, will follow the 'enable outside topic lists' setting.
      enable_outside_topic_lists: Enable thumbnails on non-topic-list pages (e.g. user activity, personal messages, suggested topics)
      placeholder_icon: Icon to display on topics without thumbnail images
      mobile_thumbnails: Enable thumbnails on mobile devices
      list_thumbnail_size: Base size for thumbnails
      view_selector_modes: Which thumbnail modes should appear in the view selector dropdown?
  dates:
    x_minutes:
      one: "%{count} min. ago"
      other: "%{count} min. ago"
    x_hours:
      one: "%{count} hr. ago"
      other: "%{count} hr. ago"
    x_days:
      one: "%{count} day ago"
      other: "%{count} days ago"
    x_months:
      one: "%{count} mo. ago"
      other: "%{count} mo. ago"
    x_years:
      one: "%{count} yr. ago"
      other: "%{count} yr. ago"
  topic_thumbnails:
    view_selector:
      label: "Change topic view"
    view_modes:
      compact-style: "Compact"
      card-style: "Card"
    actions:
      save: "Save"
      remove_saved: "Remove from saved"
      report: "Report"
