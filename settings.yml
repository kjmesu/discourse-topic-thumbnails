default_thumbnail_mode:
  default: grid
  type: enum
  choices:
    - minimal-grid
    - grid
    - masonry
    - list
    - blog-style
    - compact-style
    - card-style
    - none

docs_thumbnail_mode:
  default: none
  type: enum
  choices:
    - minimal-grid
    - grid
    - list
    - blog-style
    - compact-style
    - card-style
    - none

blog_style_categories:
  type: list
  list_type: category
  default: ""

minimal_grid_categories:
  type: list
  list_type: category
  default: ""

grid_categories:
  type: list
  list_type: category
  default: ""

masonry_categories:
  type: list
  list_type: category
  default: ""

list_categories:
  type: list
  list_type: category
  default: ""

compact_categories:
  type: list
  list_type: category
  default: ""

card_categories:
  type: list
  list_type: category
  default: ""

enabled_categories:
  type: list
  list_type: category
  default: ""
  description: "When configured, only these categories will display thumbnails. Leave empty to enable thumbnails for all categories (default behavior)."

category_placeholder_icons:
  type: string
  default: ""
  description: "Override placeholder icon for specific categories. Format: categoryId:iconName|categoryId2:iconName2 (e.g., 5:image|7:camera|12:file). Use FontAwesome icon names without 'fa-' prefix. Note: Custom icons must be registered in about.json svg_icons array or in site settings (Admin → Settings → svg_icon_subset)."

blog_style_tags:
  type: list
  list_type: tag
  default: ""

minimal_grid_tags:
  type: list
  list_type: tag
  default: ""

grid_tags:
  type: list
  list_type: tag
  default: ""

masonry_tags:
  type: list
  list_type: tag
  default: ""

list_tags:
  type: list
  list_type: tag
  default: ""

compact_tags:
  type: list
  list_type: tag
  default: ""

card_tags:
  type: list
  list_type: tag
  default: ""

suggested_topics_mode:
  default: ""
  type: enum
  choices:
    - ""
    - minimal-grid
    - grid
    - masonry
    - list
    - blog-style
    - compact-style
    - card-style
    - none

enable_outside_topic_lists: false

placeholder_icon:
  default: "comments"

mobile_thumbnails:
  default: true

list_thumbnail_size:
  client: true
  default: 200
  type: enum
  choices:
    - 200
    - 400
    - 540
    - 800

view_selector_modes:
  default: ""
  type: list
  choices:
    - minimal-grid
    - grid
    - masonry
    - list
    - blog-style
    - compact-style
    - card-style

show_user_feedback:
  default: false
  client: true
