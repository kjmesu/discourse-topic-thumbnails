default_thumbnail_mode:
  default: compact-style
  type: enum
  choices:
    - compact-style
    - card-style
    - none

docs_thumbnail_mode:
  default: none
  type: enum
  choices:
    - compact-style
    - card-style
    - none

compact_categories:
  type: list
  list_type: category
  default: ""

card_categories:
  type: list
  list_type: category
  default: ""

enabled_categories:
  type: list
  list_type: category
  default: ""
  description: "When configured, only these categories will display thumbnails. Leave empty to enable thumbnails for all categories (default behavior)."

category_placeholder_icons:
  type: string
  default: ""
  description: "Override placeholder icon for specific categories. Format: categoryId:iconName|categoryId2:iconName2 (e.g., 5:image|7:camera|12:file). Use FontAwesome icon names without 'fa-' prefix. Note: Custom icons must be registered in about.json svg_icons array or in site settings (Admin → Settings → svg_icon_subset)."

compact_tags:
  type: list
  list_type: tag
  default: ""

card_tags:
  type: list
  list_type: tag
  default: ""

suggested_topics_mode:
  default: ""
  type: enum
  choices:
    - ""
    - compact-style
    - card-style
    - none

enable_outside_topic_lists: false

placeholder_icon:
  default: "comments"

mobile_thumbnails:
  default: true

list_thumbnail_size:
  client: true
  default: 400
  type: enum
  choices:
    - 200
    - 400
    - 800

view_selector_modes:
  default: ""
  type: list
  choices:
    - compact-style
    - card-style

show_user_feedback:
  default: false
  client: true
